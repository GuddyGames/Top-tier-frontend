name: Build current project ZIP

on:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: source-frontend

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: GuddyGames/Top-tier-backend
          ref: main
          path: source-backend

      - name: Create project ZIP
        working-directory: .
        run: |
          rm -rf package
          mkdir -p package/top-tier-project
          cp -R source-frontend/. package/top-tier-project/frontend
          cp -R source-backend package/top-tier-project/backend
          rm -rf package/top-tier-project/frontend/.git
          rm -rf package/top-tier-project/backend/.git
          rm -rf package/top-tier-project/frontend/.github
          cd package
          zip -qr ../top-tier-project-current.zip top-tier-project

      - name: Upload project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: top-tier-project-current
          path: top-tier-project-current.zip
          retention-days: 7
